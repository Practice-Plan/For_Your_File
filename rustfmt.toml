# Rust formatting configuration
# Standard Rust formatting (stable features only)

# Use 4 spaces for indentation
tab_spaces = 4

# Maximum line length
max_width = 100

# Use field init shorthand where possible
use_field_init_shorthand = true

# Use try! macro instead of ? operator (false = use ?)
use_try_shorthand = false

# Note: The following unstable features are available only in nightly builds:
# - format_code_in_doc_comments
# - format_macro_matchers
# - format_macro_bodies
# - format_strings
# - wrap_comments
# - comment_width
# - normalize_doc_attributes
# - imports_granularity
# - group_imports
# - reorder_impl_items
# - space_before_colon
# - spaces_around_ranges
#
# To enable them, use nightly Rust:
# rustup default nightly