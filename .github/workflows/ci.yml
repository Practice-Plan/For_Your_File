name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Compile
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if (-not $packageVersion -or $packageVersion -ne $cargoVersion -or $packageVersion -ne $tauriVersion) {
            throw "Release versions are not synchronized: package=$packageVersion cargo=$cargoVersion tauri=$tauriVersion"
          }
          Write-Host "Release version: $packageVersion"

      - name: Check i18n resources
        run: npm run i18n:check

      - name: Type-check frontend
        run: npm run type-check

      - name: Build Go launcher (amd64)
        shell: pwsh
        run: pwsh -File launcher\build.ps1 -Arch amd64

      - name: Build Go launcher (i686)
        shell: pwsh
        run: pwsh -File launcher\build.ps1 -Arch 386 -Name fyf-launcher32.exe

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Compile test (no bundle)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features
