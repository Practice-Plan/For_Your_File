name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($packageVersion -ne '0.0.3' -or $cargoVersion -ne '0.0.3' -or $tauriVersion -ne '0.0.3') { throw "Release versions are not synchronized" }

      - name: Type-check frontend
        run: npm run type-check

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: 64-bit
          - target: i686-pc-windows-msvc
            arch: 32-bit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build with Tauri
        run: npx tauri build --target ${{ matrix.target }} --no-bundle

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stage = "release-artifacts/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $patterns = @('*.exe')
          $files = foreach ($pattern in $patterns) {
            Get-ChildItem -Path "target/${{ matrix.target }}/release" -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue
          }
          if (-not $files) { throw "No executable or installer artifacts were produced" }
          $files | Sort-Object FullName -Unique | Copy-Item -Destination $stage -Force

          Copy-Item README.md, README-zh.md, LICENSE.md, install-context-menu.ps1, uninstall-context-menu.ps1 -Destination $stage -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-release
          path: |
            release-artifacts/${{ matrix.arch }}/*
          if-no-files-found: error
