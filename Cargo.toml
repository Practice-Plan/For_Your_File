[package]
name = "lnk-file-management"
version = "0.0.1"
edition = "2021"
authors = ["Practice Plan"]
description = "LNK File Management Center - A safe and intelligent way to manage Windows shortcuts"
license = "MIT"

[dependencies]
# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Storage_StructuredStorage",
] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Tracing for performance instrumentation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI (optional, for testing)
clap = { version = "4.5", features = ["derive"] }

# Platform-specific directories
directories = "5.0"

# File system watching
notify = "6.1"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Async channels
async-channel = "2.3"

# Hashing for integrity checks
sha2 = "0.10"

# Caching
lru = "0.12"
moka = { version = "0.12", features = ["future"] }

# Memory profiling (optional)
#[cfg(feature = "memory-profile")]
dhat = "0.3"

[dev-dependencies]
tempfile = "3.12"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Performance profile for benchmarks (disabled for build)
# [profile.bench]
# opt-level = 3
# lto = true

# Benchmarks are disabled for production build
# [[bench]]
# name = "search_benchmark"
# harness = false

# [[bench]]
# name = "database_benchmark"
# harness = false

# [[bench]]
# name = "startup_benchmark"
# harness = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Storage_StructuredStorage",
] }

[[bin]]
name = "lnk-management"
path = "src/main.rs"